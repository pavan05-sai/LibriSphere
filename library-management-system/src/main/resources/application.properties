spring.application.name=library-management-system
server.port=${PORT:8081}

# Persistent embedded H2 database (stores data in ./data/library_db across restarts)
spring.datasource.url=jdbc:h2:file:./data/library_db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000}
